name: Build Pathpolio APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract Android project
        run: unzip -o Pathpolio_Android_Native_Source.zip

      - name: Build debug APK
        run: gradle -p Pathpolio_Android_Native assembleDebug --console=plain

      - name: Upload generated APK
        uses: actions/upload-artifact@v4
        with:
          name: Pathpolio-APK
          path: Pathpolio_Android_Native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
